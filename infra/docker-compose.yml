# Local development services for AttendSure. Never use these settings in production.
# Start: npm run infra:up    Stop: npm run infra:down    (needs Docker Desktop and a .env copied from .env.example)
name: attendsure

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<version>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.4-alpine
    # Append-only persistence so queued jobs survive a restart, as in production.
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible file storage. The MinIO image is no longer published on Docker Hub, so local
  # development uses SeaweedFS. The API only speaks the standard S3 protocol, so any S3 service works.
  s3:
    image: chrislusf/seaweedfs:4.52
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-s3.config=/etc/seaweedfs/s3.json']
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Catches every outgoing email so nothing reaches a real inbox. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres-data:
  redis-data:
  s3-data:
