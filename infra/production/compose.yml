# AttendSure production services (Phase 8 step 2).
#
#   proxy     HTTPS in front of everything (Caddy). /api/* goes to the two API instances; the rest to the dashboard.
#   api-1/2   two API instances (the same image), so one can restart or fail without stopping check-ins.
#   worker    background jobs and the outbox relay. Jobs run only here (RUN_JOBS_IN_API is false).
#   web       the dashboard.
#   release   applies database migrations and loads the system roles, then exits. Run it before each release.
#
# Settings come from secrets/app.env (never committed). For a real server, fill it from the host's
# secret manager; for a rehearsal on this computer, see compose.rehearsal.yml and DEPLOYMENT.md §7.
name: attendsure-production

x-api: &api
  image: attendsure-api:${ATTENDSURE_VERSION:-local}
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
    target: runtime
  env_file: ./secrets/app.env
  environment:
    NODE_ENV: production
    RUN_JOBS_IN_API: 'false'
    TRUST_PROXY_HOPS: '1'
  restart: unless-stopped
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
      ]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s

services:
  release:
    image: attendsure-api-release:${ATTENDSURE_VERSION:-local}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: migrate
    env_file: ./secrets/app.env
    environment:
      NODE_ENV: production
    restart: 'no'

  api-1:
    <<: *api
    depends_on:
      release:
        condition: service_completed_successfully

  api-2:
    <<: *api
    depends_on:
      release:
        condition: service_completed_successfully

  worker:
    image: attendsure-api:${ATTENDSURE_VERSION:-local}
    env_file: ./secrets/app.env
    environment:
      NODE_ENV: production
      RUN_JOBS_IN_API: 'false'
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    depends_on:
      release:
        condition: service_completed_successfully
      api-1:
        condition: service_healthy

  web:
    image: attendsure-web:${ATTENDSURE_VERSION:-local}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        # The file store's public address (S3_PUBLIC_ENDPOINT); the dashboard may load photos only from there.
        FILES_ORIGIN: ${FILES_ORIGIN:-}
    restart: unless-stopped

  proxy:
    image: caddy:2.10.2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    ports:
      - '${HTTPS_PORT:-443}:443'
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  caddy-data:
  caddy-config:
