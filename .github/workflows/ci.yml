name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # Integration tests run against real PostgreSQL and Redis, the same versions as local development.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: attendsure
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: attendsure
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U attendsure -d attendsure"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.8.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://attendsure:ci-only-password@localhost:5432/attendsure
      REDIS_URL: redis://localhost:6379
      PRISMA_HIDE_UPDATE_MESSAGE: 'true'
      # Test-only values for CI. They are not secrets and are used nowhere else.
      JWT_ACCESS_SECRET: ci-only-signing-secret-not-used-anywhere-else-0001
      ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzISE=
      WEB_APP_URL: http://localhost:3001
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_FROM: AttendSure CI <no-reply@localhost>
      # Matches infra/seaweedfs/s3.json, which holds local-only keys.
      S3_ENDPOINT: http://localhost:8333
      S3_ACCESS_KEY: local-dev-access-key
      S3_SECRET_KEY: local-dev-secret-key-not-for-production
      S3_BUCKET: attendsure-ci

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Started by hand because it needs a command and a mounted config, which service containers cannot take.
      - name: Start S3-compatible storage (SeaweedFS, same version as local)
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.52 server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          # Any HTTP answer (403 without credentials) means the S3 API is up.
          for i in $(seq 1 90); do
            curl -s -o /dev/null --max-time 2 http://localhost:8333 && echo "Storage up after ${i}s" && exit 0
            sleep 1
          done
          docker ps -a; docker logs s3; exit 1
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - name: Mobile app bundles for Android (no native toolchain needed)
        run: npm run bundle:check -w @attendsure/mobile
      - name: Apply migrations, seed system roles, check for schema drift
        run: |
          npm run db:deploy -w @attendsure/api
          npm run db:seed -w @attendsure/api
          npm run db:drift -w @attendsure/api
      - name: Install the Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: End-to-end browser test (dashboard against the real API)
        run: npm run e2e -w @attendsure/web
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high
