name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # Integration tests run against real PostgreSQL and Redis, the same versions as local development.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: attendsure
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: attendsure
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U attendsure -d attendsure"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.8.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://attendsure:ci-only-password@localhost:5432/attendsure
      REDIS_URL: redis://localhost:6379
      PRISMA_HIDE_UPDATE_MESSAGE: 'true'
      # Test-only values for CI. They are not secrets and are used nowhere else.
      JWT_ACCESS_SECRET: ci-only-signing-secret-not-used-anywhere-else-0001
      ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzISE=
      WEB_APP_URL: http://localhost:3001
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_FROM: AttendSure CI <no-reply@localhost>

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - name: Apply migrations, seed system roles, check for schema drift
        run: |
          npm run db:deploy -w @attendsure/api
          npm run db:seed -w @attendsure/api
          npm run db:drift -w @attendsure/api
      - name: Install the Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: End-to-end browser test (dashboard against the real API)
        run: npm run e2e -w @attendsure/web
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high
